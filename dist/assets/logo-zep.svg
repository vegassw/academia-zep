<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7700" />
      <stop offset="50%" stop-color="#ff4400" />
      <stop offset="100%" stop-color="#cc2200" />
    </linearGradient>
    
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1d22" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <pattern id="orangeStripes" width="40" height="100" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="100" fill="#ff4400" />
      <rect x="20" y="0" width="20" height="100" fill="#0f1015" />
    </pattern>

    <path id="textArc" d="M 40,75 A 220,220 0 0,1 360,75" fill="none"/>
  </defs>

  <!-- CLUB ATLÉTICO ARC TEXT -->
  <text font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="28" fill="#ffffff" stroke="#ff4400" stroke-width="2" letter-spacing="3" text-anchor="middle" filter="url(#dropShadow)">
    <textPath href="#textArc" startOffset="50%">CLUB ATLÉTICO</textPath>
  </text>

  <!-- MAIN SHIELD OUTLINE & BACKGROUND -->
  <g filter="url(#dropShadow)">
    <!-- Outer Shield Border Orange -->
    <path d="M 70,110 L 330,110 Q 335,110 335,115 C 335,260 260,370 200,415 C 140,370 65,260 65,115 Q 65,110 70,110 Z" fill="none" stroke="url(#orangeGrad)" stroke-width="12" stroke-linejoin="round" />

    <!-- Inner Shield Border White -->
    <path d="M 76,116 L 324,116 Q 328,116 328,120 C 328,255 255,362 200,405 C 145,362 72,255 72,120 Q 72,116 76,116 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />

    <!-- Shield Fill Base (Dark) -->
    <path d="M 78,118 L 322,118 C 322,250 252,358 200,400 C 148,358 78,250 78,118 Z" fill="url(#darkBg)" />

    <!-- Top Orange Bar -->
    <path d="M 82,145 L 318,145 L 318,170 L 82,170 Z" fill="url(#orangeGrad)" />

    <!-- 3 STARS AT TOP -->
    <g fill="url(#orangeGrad)" stroke="#ffffff" stroke-width="1">
      <!-- Left Star -->
      <polygon points="150,135 153,142 161,142 154,146 157,153 150,148 143,153 146,146 139,142 147,142" />
      <!-- Center Star (Larger) -->
      <polygon points="200,128 204,137 214,137 206,143 209,152 200,146 191,152 194,143 186,137 196,137" transform="scale(1.1) translate(-18, -12)"/>
      <!-- Right Star -->
      <polygon points="250,135 253,142 261,142 254,146 257,153 250,148 243,153 246,146 239,142 247,142" />
    </g>

    <!-- LOWER SHIELD VERTICAL STRIPES -->
    <g clip-path="url(#shieldClip)">
      <clipPath id="shieldClip">
        <path d="M 85,260 L 315,260 C 315,300 250,370 200,395 C 150,370 85,300 85,260 Z" />
      </clipPath>
      <!-- Vertical Stripes -->
      <rect x="80" y="250" width="240" height="150" fill="url(#orangeStripes)" />
    </g>

    <!-- ZEP MAIN TEXT BANNER -->
    <g filter="url(#dropShadow)">
      <!-- ZEP Back Glow Box -->
      <rect x="60" y="180" width="280" height="90" fill="#000000" opacity="0.8" rx="8" stroke="url(#orangeGrad)" stroke-width="4" />
      
      <!-- ZEP Text Group -->
      <g font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="92" font-style="italic">
        <!-- Z Letter (White) -->
        <text x="80" y="255" fill="url(#silverGrad)" stroke="#000" stroke-width="3">Z</text>
        <!-- E Letter (Orange) -->
        <text x="165" y="255" fill="url(#orangeGrad)" stroke="#000" stroke-width="3">E</text>
        <!-- P Letter (White) -->
        <text x="250" y="255" fill="url(#silverGrad)" stroke="#000" stroke-width="3">P</text>
      </g>
    </g>

  </g>
</svg>
